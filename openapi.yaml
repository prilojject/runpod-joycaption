openapi: 3.0.3
info:
  title: JoyCaption Batch Captioner
  version: 1.0.0
  description: >
    Runpod Serverless job schema for official JoyCaption Beta One batch captioning.
    Built with Llama. The worker code is MIT; the weights are licensed under the
    Llama 3.1 Community License.
  license:
    name: MIT (worker code); Llama 3.1 Community License (weights)
servers:
  - url: https://api.runpod.ai/v2/{endpoint_id}
    variables:
      endpoint_id:
        default: YOUR_ENDPOINT
paths:
  /run:
    post:
      summary: Queue a caption job
      operationId: runCaption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobEnvelope'
      responses:
        '200':
          description: Job accepted
components:
  schemas:
    JobEnvelope:
      type: object
      required: [input]
      properties:
        input:
          $ref: '#/components/schemas/CaptionInput'
    CaptionInput:
      type: object
      description: Provide image_url and/or dataset_url. Do not send tokens here.
      properties:
        image_url:
          type: string
          format: uri
        dataset_url:
          type: string
          format: uri
        mode:
          type: string
          default: descriptive
        tone:
          type: string
          enum: [formal, casual]
          default: formal
        length:
          type: string
          default: long
        prompt:
          type: string
          description: Overrides mode. Beta One is not a general instruction follower.
        extra_options:
          type: array
          items:
            type: string
        max_new_tokens:
          type: integer
          default: 512
        greedy:
          type: boolean
          default: false
        temperature:
          type: number
          default: 0.6
        top_p:
          type: number
          default: 0.9
        batch_size:
          type: integer
          default: 1
        overwrite:
          type: boolean
          default: false
        prepend:
          type: string
        append:
          type: string
        quantization:
          type: string
          enum: [none, 8bit]
          default: none
        hf_repo_id:
          type: string
        upload_url:
          type: string
          format: uri
        return_captions_in_response:
          type: boolean
          default: true
        run_name:
          type: string
        seed:
          type: integer
          default: 1234
        dry_run:
          type: boolean
          default: false
    CaptionOutput:
      type: object
      properties:
        status:
          type: string
        worker_version:
          type: string
        gpu:
          type: object
        config:
          type: object
        dataset:
          type: object
        captions:
          type: array
          items:
            type: object
            properties:
              file:
                type: string
              caption:
                type: string
        artifacts:
          type: object
        warnings:
          type: array
          items:
            type: string
        elapsed_seconds:
          type: number
        refresh_worker:
          type: boolean
          default: false
